schemaVersion: "1"
kind: mixin
name: aoe-agent

commands:
  install:
    - command: "apt-get update -qq && apt-get install -y -qq socat >/dev/null 2>&1 || apk add --no-cache socat >/dev/null 2>&1 || true"
    - command: "grep -qsE '^\\.aoe-hooks/?$' \"${WORKDIR}/.gitignore\" || printf '\\n.aoe-hooks/\\n' >> \"${WORKDIR}/.gitignore\""
    - command: |
        cat > /tmp/_aoe_hooks.py << 'PYEOF'
        import json, os, datetime
        H = os.environ["HOME"]
        SH = "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s STATUS > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"
        def hk(s, m=None):
            e = {"hooks": [{"type": "command", "command": SH.replace("STATUS", s)}]}
            if m: e["matcher"] = m
            return [e]
        def cmd(s):
            return SH.replace("STATUS", s)
        agents = {
            ".claude/settings.json": {
                "PreToolUse": hk("running"),
                "UserPromptSubmit": hk("running"),
                "Stop": hk("idle"),
                "Notification": hk("waiting", "permission_prompt|elicitation_dialog"),
                "ElicitationResult": hk("running"),
            },
            ".gemini/settings.json": {
                "BeforeTool": hk("running"),
                "BeforeAgent": hk("running"),
                "AfterAgent": hk("idle"),
                "Notification": hk("waiting", "ToolPermission"),
            },
            ".cursor/settings.json": {
                "PreToolUse": hk("running"),
                "UserPromptSubmit": hk("running"),
                "Stop": hk("idle"),
                "Notification": hk("waiting", "permission_prompt|elicitation_dialog"),
                "ElicitationResult": hk("running"),
            },
            ".qwen/settings.json": {
                "PreToolUse": hk("running"),
                "UserPromptSubmit": hk("running"),
                "PostToolUse": hk("running"),
                "Stop": hk("idle"),
                "Notification": hk("waiting", "permission_prompt|elicitation_dialog"),
            },
        }
        for rel, hooks in agents.items():
            p = os.path.join(H, rel)
            os.makedirs(os.path.dirname(p), exist_ok=True)
            s = {}
            if os.path.exists(p):
                try: s = json.load(open(p))
                except: pass
            s["hooks"] = hooks
            with open(p, "w") as f:
                json.dump(s, f, indent=2)
                f.write("\n")

        # Hermes: YAML config with shell-hooks-allowlist.json
        hermes_hooks = {
            "pre_llm_call": "running",
            "pre_tool_call": "running",
            "post_llm_call": "idle",
            "pre_approval_request": "waiting",
            "post_approval_response": "running",
            "on_session_end": "idle",
        }
        hermes_dir = os.path.join(H, ".hermes")
        hermes_cfg = os.path.join(hermes_dir, "config.yaml")
        os.makedirs(hermes_dir, exist_ok=True)
        hcfg = {}
        if os.path.exists(hermes_cfg):
            try:
                import yaml
                with open(hermes_cfg) as f:
                    hcfg = yaml.safe_load(f) or {}
            except Exception:
                hcfg = {}
        if not isinstance(hcfg, dict):
            hcfg = {}
        hcfg.setdefault("hooks", {})
        if not isinstance(hcfg["hooks"], dict):
            hcfg["hooks"] = {}
        marker = "aoe-hooks"
        for event, status in hermes_hooks.items():
            entries = hcfg["hooks"].get(event, [])
            if not isinstance(entries, list):
                entries = []
            entries = [e for e in entries if not (isinstance(e, dict) and marker in e.get("command", ""))]
            entries.append({"command": cmd(status)})
            hcfg["hooks"][event] = entries
        try:
            import yaml
            with open(hermes_cfg, "w") as f:
                yaml.dump(hcfg, f, default_flow_style=False)
        except ImportError:
            pass
        now = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
        allowlist_path = os.path.join(hermes_dir, "shell-hooks-allowlist.json")
        alist = {"approvals": []}
        if os.path.exists(allowlist_path):
            try:
                with open(allowlist_path) as f:
                    alist = json.load(f)
            except Exception:
                alist = {"approvals": []}
        approvals = alist.get("approvals", [])
        for event, status in hermes_hooks.items():
            c = cmd(status)
            approvals = [a for a in approvals if not (a.get("event") == event and a.get("command") == c)]
            approvals.append({"event": event, "command": c, "approved_at": now, "script_mtime_at_approval": None})
        alist["approvals"] = approvals
        with open(allowlist_path, "w") as f:
            json.dump(alist, f, indent=2)
            f.write("\n")

        # Kiro: per-agent JSON config
        kiro_hooks = {
            "preToolUse": "running",
            "userPromptSubmit": "running",
            "stop": "idle",
        }
        kiro_agents_dir = os.path.join(H, ".kiro", "agents")
        kiro_cfg = os.path.join(kiro_agents_dir, "aoe-hooks.json")
        os.makedirs(kiro_agents_dir, exist_ok=True)
        kcfg = {}
        if os.path.exists(kiro_cfg):
            try:
                with open(kiro_cfg) as f:
                    kcfg = json.load(f)
            except Exception:
                kcfg = {}
        kcfg.setdefault("name", "aoe-hooks")
        kcfg.setdefault("tools", ["*"])
        kcfg.setdefault("hooks", {})
        if not isinstance(kcfg["hooks"], dict):
            kcfg["hooks"] = {}
        for event, status in kiro_hooks.items():
            entries = kcfg["hooks"].get(event, [])
            if not isinstance(entries, list):
                entries = []
            entries = [e for e in entries if not (isinstance(e, dict) and marker in e.get("command", ""))]
            entries.append({"command": cmd(status)})
            kcfg["hooks"][event] = entries
        with open(kiro_cfg, "w") as f:
            json.dump(kcfg, f, indent=2)
            f.write("\n")
        PYEOF
        python3 /tmp/_aoe_hooks.py && rm -f /tmp/_aoe_hooks.py
  startup:
    - command: ["sh", "-c", "export SSH_AUTH_SOCK=/run/ssh-agent.sock; [ -S \"$SSH_AUTH_SOCK\" ] && ssh-add -l >/dev/null 2>&1 || true"]
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 || command -v codex >/dev/null 2>&1 || command -v opencode >/dev/null 2>&1 || command -v gemini >/dev/null 2>&1 || command -v cursor >/dev/null 2>&1 || command -v droid >/dev/null 2>&1 || command -v pi >/dev/null 2>&1 || command -v qwen >/dev/null 2>&1 || command -v kiro-cli >/dev/null 2>&1 || command -v hermes >/dev/null 2>&1 || command -v vibe >/dev/null 2>&1 || (printf 'aoe-agent: no known agent binary on PATH\\n' >&2; exit 1)"]

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - MISTRAL_API_KEY
    - QWEN_API_KEY
    - DEEPSEEK_API_KEY

credentials:
  sources:
    ssh:
      env:
        - SSH_AUTH_SOCK
