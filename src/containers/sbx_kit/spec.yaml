schemaVersion: "1"
kind: mixin
name: aoe-agent

commands:
  install:
    - command: "sh /sbx-kit/install.sh"
    - command: "grep -qsE '^\\.aoe-hooks/?$' \"${WORKDIR}/.gitignore\" || printf '\\n.aoe-hooks/\\n' >> \"${WORKDIR}/.gitignore\""
  startup:
    - command: ["sh", "-c", "command -v claude >/dev/null 2>&1 || command -v codex >/dev/null 2>&1 || command -v opencode >/dev/null 2>&1 || command -v gemini >/dev/null 2>&1 || command -v cursor >/dev/null 2>&1 || command -v droid >/dev/null 2>&1 || command -v pi >/dev/null 2>&1 || command -v qwen >/dev/null 2>&1 || command -v kiro-cli >/dev/null 2>&1 || command -v hermes >/dev/null 2>&1 || command -v vibe >/dev/null 2>&1 || (printf 'aoe-agent: no known agent binary on PATH\\n' >&2; exit 1)"]

initFiles:
  - path: /home/agent/.claude/settings.json
    mode: "0644"
    content: |
      {
        "hooks": {
          "PreToolUse": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "UserPromptSubmit": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Stop": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s idle > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Notification": [
            {"matcher": "permission_prompt|elicitation_dialog", "hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s waiting > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "ElicitationResult": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ]
        }
      }
  - path: /home/agent/.gemini/settings.json
    mode: "0644"
    content: |
      {
        "hooks": {
          "BeforeTool": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "BeforeAgent": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "AfterAgent": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s idle > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Notification": [
            {"matcher": "ToolPermission", "hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s waiting > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ]
        }
      }
  - path: /home/agent/.cursor/settings.json
    mode: "0644"
    content: |
      {
        "hooks": {
          "PreToolUse": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "UserPromptSubmit": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Stop": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s idle > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Notification": [
            {"matcher": "permission_prompt|elicitation_dialog", "hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s waiting > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "ElicitationResult": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ]
        }
      }
  - path: /home/agent/.qwen/settings.json
    mode: "0644"
    content: |
      {
        "hooks": {
          "PreToolUse": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "UserPromptSubmit": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "PostToolUse": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s running > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Stop": [
            {"hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s idle > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ],
          "Notification": [
            {"matcher": "permission_prompt|elicitation_dialog", "hooks": [{"type": "command", "command": "sh -c '[ -n \"$AOE_INSTANCE_ID\" ] || exit 0; mkdir -p \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID\" && printf %s waiting > \"${WORKDIR}/.aoe-hooks/$AOE_INSTANCE_ID/status\"'"}]}
          ]
        }
      }

environment:
  proxyManaged:
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - MISTRAL_API_KEY
    - QWEN_API_KEY
    - DEEPSEEK_API_KEY

credentials:
  sources:
    ssh:
      env:
        - SSH_AUTH_SOCK
